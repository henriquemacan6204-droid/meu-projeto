name: Compilar Luma Glass APK
on:
  push:
    branches: [navegador-ios27-geckoview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar SDK Android 35
        run: |
          SDK="$ANDROID_HOME"
          TOOL="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$TOOL" --sdk_root="$SDK" --licenses >/dev/null || true
          "$TOOL" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LumaGlass-iOS27-Gecko-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
